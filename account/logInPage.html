<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yummy Flavors</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <div class="login-header">
                <div class="login-logo">YF</div>
                <h1>Welcome Back!</h1>
                <p>Ready to cook something delicious?</p>
            </div>

           <form id="loginForm" class="login-form">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="chef@mail.com" required>
                </div>

                <div class="input-group">
                    <div class="password-row">
                        <label for="password">Password</label>
                    </div>

                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="login-btn">Get Cooking</button>

            </form>

            <div class="signup-box">
                <p>New around the kitchen?</p>
                <a href="signUpPage.html" class="signup-btn">Create Account</a>
            </div>

        </div>

    </main>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>

</body>
</html>
