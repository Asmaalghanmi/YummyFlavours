<main class="edit-page">
    <div class="form-box">
        <h1>Edit Profile</h1>
        <p>Update your profile details below.</p>

        <!-- Removed 'action' to let JS handle the submission -->
        <form id="editProfileForm">

            <label for="editFname">Display Name</label>
            <input type="text" id="editFname" placeholder="Your full name" required>

            <label for="editUsername">Username</label>
            <input type="text" id="editUsername" placeholder="Your unique handle" required>

            <label for="editBio">Bio</label>
            <!-- Changed to textarea for better bio writing -->
            <textarea id="editBio" placeholder="Tell us about your cooking style..." rows="3"></textarea>

            <button type="submit" class="save-btn">Save Changes</button>

            <a href="account.html" class="cancel-btn">Cancel</a>

        </form>
    </div>
</main>
